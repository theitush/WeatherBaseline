<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WeatherBaseline</title>
    <meta name="description" content="How extreme is this weather?" />

    <!-- Social link previews (Open Graph / Twitter). Same card for every link:
         crawlers don't run JS, and the static HTML is one file for all paths. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WeatherBaseline" />
    <meta property="og:title" content="WeatherBaseline" />
    <meta property="og:description" content="How extreme is this weather?" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="WeatherBaseline" />
    <meta name="twitter:description" content="How extreme is this weather?" />
    <script>
      // Apply saved theme before first paint to avoid a flash of the wrong mode.
      // Only an explicit choice sets data-theme; absent it, the OS preference wins via CSS.
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark')
          document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
