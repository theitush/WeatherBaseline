<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WeatherBaseline</title>
    <meta name="description" content="Any day, any place." />
    <link rel="canonical" href="https://www.weatherbaseline.com/" />

    <!-- Social link previews (Open Graph / Twitter). The title is always the
         question; the description carries date + location. For deep links the
         Pages Function (functions/_middleware.js) fills the description in
         server-side per crawler. This static default is the bare-root card. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WeatherBaseline" />
    <meta property="og:url" content="https://www.weatherbaseline.com/" />
    <meta property="og:title" content="How extreme is this weather?" />
    <meta property="og:description" content="Any day, any place." />
    <meta property="og:image" content="https://www.weatherbaseline.com/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="WeatherBaseline.com" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="How extreme is this weather?" />
    <meta name="twitter:description" content="Any day, any place." />
    <meta name="twitter:image" content="https://www.weatherbaseline.com/og-card.png" />
    <script>
      // Apply saved theme before first paint to avoid a flash of the wrong mode.
      // Only an explicit choice sets data-theme; absent it, the OS preference wins via CSS.
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark')
          document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
