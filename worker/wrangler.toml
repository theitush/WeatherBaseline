# Cloudflare Worker — WeatherBaseline v2 control plane (ensure-fresh + geo).
#
# The Worker is the thin tail-only backend from ARCHITECTURE.md: it tops up the
# volatile recent/forecast tiers from Open-Meteo and writes them to R2. Reads of
# the .csv.gz tier files go DIRECT to R2's public URL (the frontend's
# VITE_DATA_BASE), never through this Worker — so file reads don't consume the
# Worker request budget.
#
# Local dev: `npm run dev` (→ `wrangler dev --remote --port 8787`) binds this
# Worker to the REAL R2 bucket below, so local dev reads/writes the same data as
# prod (dev = local code, remote data). The Vite proxy forwards the frontend's
# /api/* to this port. `npm run dev:local` falls back to a Miniflare-emulated R2
# in .wrangler/state (no account needed; seed it with scripts/seed-local-r2.sh).
# Legacy name from the project's original title (HowHotWasIt) — deliberately kept.
# This is the Worker's IDENTITY: renaming it deploys a new Worker and leaves the
# dashboard-managed www.weatherbaseline.com/api/* route on the old one. See DEPLOY.md.
name = "howhotwasit"
main = "src/index.js"
compatibility_date = "2024-09-23"
# nodejs_compat gives us a few Node globals; the core logic only needs fetch +
# the Web Crypto/Streams already in the Workers runtime.
compatibility_flags = ["nodejs_compat"]

# R2 binding: env.BUCKET in the Worker. The bucket_name is only used against the
# real account on `wrangler deploy`; under `--local` Miniflare ignores it and
# uses local storage keyed by the binding name.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "weather-baseline"

[vars]
# Freshness thresholds (ms). Overridable per-environment: forecast 12h, recent
# 24h. ensureFresh.js falls back to these same defaults if the vars are absent.
FORECAST_TTL_MS = "43200000"
RECENT_TTL_MS = "86400000"
# Pepper for the stable visitor hash: visitor = sha256(ip + ua + salt). Not a
# true secret (we never store the raw IP) — it just stops trivial recomputation.
# Keep it fixed: changing it later makes every past visitor look brand new.
VISITOR_SALT = "hhwi-2026-change-me"

# NOTE: DASHBOARD_TOKEN — the password for /dashboard and /api/analytics — is a
# real secret and is deliberately NOT defined here (this file is committed).
# Set it once for prod, never in the repo:
#   cd worker && npx wrangler secret put DASHBOARD_TOKEN
# For local dev, put it in worker/.dev.vars (gitignored):
#   DASHBOARD_TOKEN = "your-password"
# The dashboard returns 503 until it's set, and 401 on any wrong password.

# D1 binding for unique-visitor logging (env.DB). COMMENTED OUT so the current
# `wrangler dev --remote` keeps starting without a database; the Worker no-ops
# logging whenever env.DB is absent. To turn it on, create the DB, paste its id
# below, uncomment this block, apply the migration, then deploy:
#   npx wrangler d1 create howhotwasit-analytics
#   # → copy the printed database_id into database_id below
#   npx wrangler d1 execute howhotwasit-analytics --remote --file=migrations/0001_create_hits.sql
#   npx wrangler deploy
[[d1_databases]]
binding = "DB"
database_name = "howhotwasit-analytics"
database_id = "603904f7-113b-4aaa-866c-c49d8c38fca0"
