# Cloudflare Worker — HowHotWasIt v2 control plane (ensure-fresh + geo).
#
# The Worker is the thin tail-only backend from ARCHITECTURE.md: it tops up the
# volatile recent/forecast tiers from Open-Meteo and writes them to R2. Reads of
# the .csv.gz tier files go DIRECT to R2's public URL (the frontend's
# VITE_DATA_BASE), never through this Worker — so file reads don't consume the
# Worker request budget.
#
# Local dev: `npm run dev` (→ `wrangler dev --remote --port 8787`) binds this
# Worker to the REAL R2 bucket below, so local dev reads/writes the same data as
# prod (dev = local code, remote data). The Vite proxy forwards the frontend's
# /api/* to this port. `npm run dev:local` falls back to a Miniflare-emulated R2
# in .wrangler/state (no account needed; seed it with scripts/seed-local-r2.sh).
name = "howhotwasit"
main = "src/index.js"
compatibility_date = "2024-09-23"
# nodejs_compat gives us a few Node globals; the core logic only needs fetch +
# the Web Crypto/Streams already in the Workers runtime.
compatibility_flags = ["nodejs_compat"]

# R2 binding: env.BUCKET in the Worker. The bucket_name is only used against the
# real account on `wrangler deploy`; under `--local` Miniflare ignores it and
# uses local storage keyed by the binding name.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "weather-baseline"

[vars]
# Freshness thresholds (ms). Overridable per-environment: forecast 12h, recent
# 24h. ensureFresh.js falls back to these same defaults if the vars are absent.
FORECAST_TTL_MS = "43200000"
RECENT_TTL_MS = "86400000"
